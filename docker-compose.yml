version: "3.8"

services:
  doculens-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doculens-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DOCULENS_ROOT=/app
      - PYTHONPATH=/app
      - SECRET_KEY=doculens-enterprise-production-jwt-token-key-2026
      - STEGO_HMAC_KEY=doculens-enterprise-stego-crypto-hmac-key-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - doculens_db:/app/database
      - doculens_uploads:/app/uploads
      - doculens_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  doculens_db:
    driver: local
  doculens_uploads:
    driver: local
  doculens_cache:
    driver: local
